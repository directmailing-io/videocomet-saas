services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: videocomet
      POSTGRES_PASSWORD: videocomet
      POSTGRES_DB: videocomet
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    restart: unless-stopped
