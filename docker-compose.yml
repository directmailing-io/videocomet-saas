# NUR fuer lokale Entwicklung. Ports sind bewusst auf 127.0.0.1 gebunden,
# damit DB/Redis nie versehentlich im Netz haengen, falls das Compose-File
# doch mal auf einem Server gestartet wird.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: videocomet
      POSTGRES_PASSWORD: videocomet
      POSTGRES_DB: videocomet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    restart: unless-stopped
