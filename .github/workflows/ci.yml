name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
        env:
          DATABASE_URL: postgres://stub:stub@localhost:5432/stub
          COOKIE_SECRET: ci_secret
